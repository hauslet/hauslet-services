# Cloud Build configuration for Hauslet Services - Staging
# Triggered on push to staging branch
# Builds and deploys API and Worker services to staging environment

substitutions:
  _REGION: 'europe-north1'
  _TAG: 'manual'
  _API_SERVICE_NAME: 'hauslet-api-staging'
  _WORKER_SERVICE_NAME: 'hauslet-worker-staging'
  _API_MIN_INSTANCES: '0'  # Cost savings in staging
  _WORKER_MIN_INSTANCES: '0'
  _API_MAX_INSTANCES: '3'  # Lower limits for staging
  _WORKER_MAX_INSTANCES: '2'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

steps:
  # Step 1: Build API Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_API_SERVICE_NAME}:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_API_SERVICE_NAME}:staging-latest'
      - '-f'
      - 'deploy/Dockerfile.api'
      - '.'
    waitFor: ['-']

  # Step 2: Build Worker Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-worker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_WORKER_SERVICE_NAME}:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_WORKER_SERVICE_NAME}:staging-latest'
      - '-f'
      - 'deploy/Dockerfile.worker'
      - '.'
    waitFor: ['build-api']

  # Step 3: Push API image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_API_SERVICE_NAME}'
    waitFor: ['build-api']

  # Step 4: Push Worker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-worker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_WORKER_SERVICE_NAME}'
    waitFor: ['build-worker']

  # Step 5: Deploy API to staging
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_API_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_API_SERVICE_NAME}:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=${_API_MIN_INSTANCES}'
      - '--max-instances=${_API_MAX_INSTANCES}'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--timeout=60s'
      - '--concurrency=80'
      
      # Connect Cloud SQL
      - '--set-cloudsql-instances=$PROJECT_ID:${_REGION}:hauslet-postgres-primary'
      
      # Bind ALL Secrets (App Secrets + Cloud Tasks Credentials)
      - '--set-secrets=APP_ENV=APP_ENV:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,CDN_HOST=CDN_HOST:latest,DATABASE_URL=DATABASE_URL:latest,EMAIL_FROM=EMAIL_FROM:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,FX_API_KEY=FX_API_KEY:latest,FX_URL=FX_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,JWT_SECRET=JWT_SECRET:latest,PAYSTACK_PUBLIC_KEY=PAYSTACK_PUBLIC_KEY:latest,PAYSTACK_SECRET_KEY=PAYSTACK_SECRET_KEY:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_ACCESS_KEY_SECRET=R2_ACCESS_KEY_SECRET:latest,R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest,R2_BUCKET_NAME=R2_BUCKET_NAME:latest,R2_ENDPOINT=R2_ENDPOINT:latest,REDIRECT_URL=REDIRECT_URL:latest,REDIS_ADDR=REDIS_ADDR:latest,RESEND_API_KEY=RESEND_API_KEY:latest,STRIPE_PUBLISHABLE_KEY=STRIPE_PUBLISHABLE_KEY:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,CLOUD_TASKS_PROJECT_ID=CLOUD_TASKS_PROJECT_ID:latest,CLOUD_TASKS_LOCATION=CLOUD_TASKS_LOCATION:latest,CLOUD_TASKS_WORKER_URL=CLOUD_TASKS_WORKER_URL:latest,CLOUD_TASKS_SERVICE_ACCOUNT=CLOUD_TASKS_SERVICE_ACCOUNT:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_PORT=SMTP_PORT:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,DISABLE_XSRF=DISABLE_XSRF:latest,VERTEX_AI_PROJECT_ID=VERTEX_AI_PROJECT_ID:latest,VERTEX_AI_AGENT_ID=VERTEX_AI_AGENT_ID:latest,VERTEX_AI_LOCATION=VERTEX_AI_LOCATION:latest'
      
      # Network & Identity
      - '--service-account=hauslet-api-staging-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--vpc-connector=hauslet-vpc-connector'
      - '--vpc-egress=private-ranges-only'
    waitFor: ['push-api']

  # Step 6: Deploy Worker to staging
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_WORKER_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_WORKER_SERVICE_NAME}:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--min-instances=${_WORKER_MIN_INSTANCES}'
      - '--max-instances=${_WORKER_MAX_INSTANCES}'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--timeout=300s'
      - '--concurrency=10'
      
      # Connect Cloud SQL
      - '--set-cloudsql-instances=$PROJECT_ID:${_REGION}:hauslet-postgres-primary'
      
      # Bind ALL Secrets (Same as API)
      - '--set-secrets=APP_ENV=APP_ENV:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,CDN_HOST=CDN_HOST:latest,DATABASE_URL=DATABASE_URL:latest,EMAIL_FROM=EMAIL_FROM:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,FX_API_KEY=FX_API_KEY:latest,FX_URL=FX_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,JWT_SECRET=JWT_SECRET:latest,PAYSTACK_PUBLIC_KEY=PAYSTACK_PUBLIC_KEY:latest,PAYSTACK_SECRET_KEY=PAYSTACK_SECRET_KEY:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_ACCESS_KEY_SECRET=R2_ACCESS_KEY_SECRET:latest,R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest,R2_BUCKET_NAME=R2_BUCKET_NAME:latest,R2_ENDPOINT=R2_ENDPOINT:latest,REDIRECT_URL=REDIRECT_URL:latest,REDIS_ADDR=REDIS_ADDR:latest,RESEND_API_KEY=RESEND_API_KEY:latest,STRIPE_PUBLISHABLE_KEY=STRIPE_PUBLISHABLE_KEY:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,CLOUD_TASKS_PROJECT_ID=CLOUD_TASKS_PROJECT_ID:latest,CLOUD_TASKS_LOCATION=CLOUD_TASKS_LOCATION:latest,CLOUD_TASKS_WORKER_URL=CLOUD_TASKS_WORKER_URL:latest,CLOUD_TASKS_SERVICE_ACCOUNT=CLOUD_TASKS_SERVICE_ACCOUNT:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_PORT=SMTP_PORT:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,VERTEX_AI_PROJECT_ID=VERTEX_AI_PROJECT_ID:latest,VERTEX_AI_AGENT_ID=VERTEX_AI_AGENT_ID:latest,VERTEX_AI_LOCATION=VERTEX_AI_LOCATION:latest'
      
      # Network & Identity
      - '--service-account=hauslet-worker-staging-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--vpc-connector=hauslet-vpc-connector'
      - '--vpc-egress=private-ranges-only'
    waitFor: ['push-worker']

  # Step 7: Smoke tests
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        API_URL=$$(gcloud run services describe ${_API_SERVICE_NAME} \
          --region=${_REGION} \
          --format='value(status.url)')

        echo "🧪 Testing Staging API: $$API_URL"

        # Health check
        HTTP_CODE=$$(curl -s -o /dev/null -w "%{http_code}" $$API_URL/health)
        if [ "$$HTTP_CODE" != "200" ]; then
          echo "❌ Health check failed: $$HTTP_CODE"
          exit 1
        fi

        echo "✅ Staging deployment successful"
        echo "📍 Staging API: $$API_URL"
    waitFor: ['deploy-api', 'deploy-worker']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_API_SERVICE_NAME}:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_API_SERVICE_NAME}:staging-latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_WORKER_SERVICE_NAME}:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/hauslet/${_WORKER_SERVICE_NAME}:staging-latest'

timeout: '1200s'
