{{define "content"}}
<div style="padding: 0 20px;">
    <h1 style="font-size: 26px; font-weight: bold; margin-top: 36px; text-align: center; color: #000000;">
        Host responded to your review
    </h1>

    <p style="font-size: 16px; line-height: 26px; text-align: center; color: #000000;">
        Hi {{.GuestName}}, the host replied to your review of <strong>{{.ListingTitle}}</strong>.
    </p>

    <div style="background-color: #F6F0FB; border-radius: 8px; padding: 20px; margin: 24px 0;">
        <p style="margin: 0; font-size: 14px; line-height: 22px; color: #666666; text-transform: uppercase; font-weight: bold;">
            Host's Response
        </p>
        <div style="margin-top: 12px;">
            <p style="margin: 0; font-size: 15px; line-height: 24px; color: #000000;">
                "{{.ResponseBody}}"
            </p>
        </div>
    </div>

    <div style="text-align: center; margin: 36px 0;">
        <a href="{{.ReviewURL}}" style="display: inline-block; background-color: #924DBF; color: white; padding: 14px 32px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px;">
            View Full Conversation
        </a>
    </div>

    <p style="font-size: 13px; line-height: 22px; color: #666666; text-align: center;">
        This response is now visible on the listing page along with your review.
    </p>
</div>
{{end}}

{{template "layout" .}}
