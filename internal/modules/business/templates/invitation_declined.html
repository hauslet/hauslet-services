{{define "content"}}
<div style="padding: 0 20px;">

    {{if .BusinessLogoURL}}
    <div style="text-align: center; margin: 30px 0;">
        <img src="{{.BusinessLogoURL}}" alt="{{.BusinessName}}" style="max-width: 150px; height: auto; border-radius: 8px;">
    </div>
    {{end}}

    <h1 style="font-size: 28px; font-weight: bold; margin-top: 48px; text-align: center; color: #000000;">
        Invitation Declined
    </h1>

    <p style="font-size: 16px; line-height: 26px; text-align: center; margin-bottom: 30px; color: #000000;">
        <strong>{{.DeclinedBy}}</strong> ({{.DeclinedEmail}}) has declined your invitation to join <strong>{{.BusinessName}}</strong>.
    </p>

    <div style="background-color: #f4f4f4; border-radius: 8px; padding: 20px; margin: 30px 0;">
        <p style="font-size: 14px; line-height: 22px; color: #666666; margin: 0; text-align: center;">
            You can invite someone else or try reaching out to them directly.
        </p>
    </div>

    <div style="text-align: center; margin: 40px 0;">
        <a href="{{.InvitationsURL}}" style="display: inline-block; background-color: #924DBF; color: white; padding: 14px 32px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px;">
            Manage Invitations
        </a>
    </div>

</div>
{{end}}

{{template "layout" .}}
