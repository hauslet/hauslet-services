{{define "content"}}
<div style="padding: 0 20px;">

    <h1 style="font-size: 28px; font-weight: bold; margin-top: 48px; text-align: center; color: #000000;">
        Password Updated
    </h1>

    <p style="font-size: 16px; line-height: 26px; text-align: center; margin-bottom: 30px; color: #000000;">
        {{if .Name}}Hi {{.Name}}, {{end}}your Hauslet password was changed successfully.
    </p>

    <div style="background-color: #f4f4f4; border-radius: 8px; padding: 18px; margin: 0 auto 24px auto; max-width: 360px;">
        <p style="margin: 0; font-size: 14px; line-height: 22px; color: #4a5568; text-align: center;">
            If you did not make this change, reset your password immediately and contact support.
        </p>
    </div>

    <p style="font-size: 14px; line-height: 22px; color: #666666; text-align: center;">
        Time: {{.Timestamp}}
    </p>

</div>
{{end}}

{{template "layout" .}}
