{{define "content"}}
<div style="padding: 0 20px;">

    <h1 style="font-size: 28px; font-weight: bold; margin-top: 48px; text-align: center; color: #000000;">
        Sign in to Hauslet
    </h1>

    <p style="font-size: 16px; line-height: 26px; text-align: center; margin-bottom: 30px; color: #000000;">
        Enter this code to sign in:
    </p>

    <div style="background-color: #f4f4f4; border-radius: 8px; padding: 20px; margin: 30px auto; max-width: 320px; text-align: center;">
        <p style="font-size: 34px; font-weight: bold; letter-spacing: 6px; color: #924DBF; margin: 0;">
            {{.Code}}
        </p>
    </div>

    <div style="text-align: center; margin: 30px 0;">
        <p style="font-size: 14px; color: #666666; margin-bottom: 16px;">
            Or click the button below to sign in instantly:
        </p>
        <a href="{{.MagicLink}}"
           style="display: inline-block; background-color: #924DBF; color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; font-weight: 600;">
            Sign in to Hauslet
        </a>
    </div>

    <p style="font-size: 14px; line-height: 22px; color: #666666; text-align: center; margin-top: 24px;">
        This code expires in {{.TTL}} minutes. If you didn't request this, you can safely ignore this email.
    </p>

</div>
{{end}}

{{template "layout" .}}
