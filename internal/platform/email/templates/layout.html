{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{{.Subject}}</title>
    <style>
        /* Resets to ensure clients render correctly */
        body { margin: 0; padding: 0; width: 100%; word-break: break-word; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body style="background-color: #f6f9fc; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Ubuntu,sans-serif; padding: 20px 0;">
    
    <div style="display:none;font-size:1px;color:#333333;line-height:1px;max-height:0px;max-width:0px;opacity:0;overflow:hidden;">
        {{.Preview}}
    </div>

    <div style="background-color: #ffffff; margin: 0 auto; padding: 0; margin-bottom: 64px; border-radius: 12px; max-width: 600px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07); overflow: hidden;">
        
        <div style="padding: 32px 20px 24px; text-align: center; border-bottom: 1px solid #f0f0f0;">
            <a href="https://hauslet.com" style="display: inline-block; text-decoration: none;">
                <img src="https://cdn.hauslet.com/assets/vector.png" alt="Hauslet Logo" width="100" style="display: block; margin: 0 auto; width: 50px; max-width: 100%; height: auto;" />
            </a>
        </div>

        <div style="padding: 0;">
            {{template "content" .}}
        </div>

        <hr style="border: 0; border-top: 1px solid #e6ebf1; margin: 0;" />
        
        <div style="padding: 24px 20px 32px; background-color: #fafbfc;">
            <p style="color: #8898aa; font-size: 12px; line-height: 20px; text-align: center; margin: 0 0 8px 0;">
                © {{.Year}} Hauslet. All rights reserved.
            </p>
            
            <p style="color: #8898aa; font-size: 12px; line-height: 20px; text-align: center; margin: 0 0 8px 0;">
                <a href="https://hauslet.com/help" style="color: #924DBF; text-decoration: none;">Help Center</a>
                &nbsp;•&nbsp;
                <a href="https://hauslet.com/privacy" style="color: #924DBF; text-decoration: none;">Privacy Policy</a>
                &nbsp;•&nbsp;
                <a href="https://hauslet.com/terms" style="color: #924DBF; text-decoration: none;">Terms of Service</a>
            </p>
            
            <p style="color: #aab7c4; font-size: 11px; line-height: 18px; text-align: center; margin: 8px 0 0 0;">
                Hauslet, Inc. • support@hauslet.com
            </p>
        </div>

    </div>
</body>
</html>
{{end}}
