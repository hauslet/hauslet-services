# gqlgen.yml

# 1. Schema Location
schema:
  - internal/transport/graph/*.graphqls
  - internal/modules/auth/port/graphql/*.graphqls
  - internal/modules/profile/port/graphql/*.graphqls
  - internal/modules/property/port/graphql/*.graphqls
  - internal/modules/business/port/graphql/*.graphqls
  - internal/modules/booking/port/graphql/*.graphqls
  - internal/modules/payments/port/graphql/*.graphqls
  - internal/modules/finance/port/graphql/*.graphqls
  - internal/modules/wishlist/port/graphql/*.graphqls
  - internal/modules/review/port/graphql/*.graphqls
  - internal/modules/promotions/port/graphql/*.graphqls
  - internal/modules/leads/port/graphql/*.graphqls

# 2. Server Logic (The Wiring)
exec:
  filename: internal/transport/graph/generated.go
  package: graph

# 3. Generated Models
# Input types and types NOT bound to Go structs land here
model:
  filename: internal/transport/graph/model/models_gen.go
  package: model

# 4. Resolver Implementation
resolver:
  layout: follow-schema
  dir: internal/transport/graph
  package: graph
  filename_template: "{name}.resolvers.go"

# 5. Type Mappings (The Bridge)
models:
  # --- Standard Scalars ---
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  
  # --- Auth Module Bindings ---
  User:
    model: hauslet/internal/modules/auth/domain.User
  UserIdentity:
    model: hauslet/internal/modules/auth/domain.UserIdentity
  Role:
    model: hauslet/internal/modules/auth/domain.UserRole

  # --- Profile Module Bindings ---
  Profile:
    model: hauslet/internal/modules/profile/domain.Profile
  
  # TravelCompanion is nested inside Profile
  TravelCompanion:
    model: hauslet/internal/modules/profile/domain.TravelCompanion

  # Enum Mappings
  UserType:
    model: hauslet/internal/modules/profile/domain.UserType
  Badge:
    model: hauslet/internal/modules/profile/domain.Badge
  UUID:
    model:
      - github.com/google/uuid.UUID

  # --- Property Module Bindings ---
  Property:
    model: hauslet/internal/modules/property/domain.Property
  Listing:
    model: hauslet/internal/modules/property/domain.Listing
  ListingMedia:
    model: hauslet/internal/modules/property/domain.ListingMedia
  Location:
    model: hauslet/internal/modules/property/domain.Location
  ShortletDetail:
    model: hauslet/internal/modules/property/domain.ShortletDetail
  RentalDetail:
    model: hauslet/internal/modules/property/domain.RentalDetail
  SaleDetail:
    model: hauslet/internal/modules/property/domain.SaleDetail
  AmenityHighlight:
    model: hauslet/internal/modules/property/domain.AmenityHighlight
  RuleGroup:
    model: hauslet/internal/modules/property/domain.RuleGroup
  ServiceCharge:
    model: hauslet/internal/modules/property/domain.ServiceCharge
  ListingCompleteness:
    model: hauslet/internal/modules/property/domain.ListingCompleteness
  Thumbnail:
    model: hauslet/internal/modules/property/domain.Thumbnail
  ThumbnailVariant:
    model: hauslet/internal/modules/property/domain.ThumbnailVariant

  # Property Enums
  CountryCode:
    model: hauslet/internal/modules/property/domain.CountryCode
  CurrencyCode:
    model: hauslet/internal/modules/property/domain.CurrencyCode
  OwnerType:
    model: hauslet/internal/modules/property/domain.OwnerType
  PropertyClass:
    model: hauslet/internal/modules/property/domain.PropertyClass
  PropertyType:
    model: hauslet/internal/modules/property/domain.PropertyType
  PropertyCondition:
    model: hauslet/internal/modules/property/domain.PropertyCondition
  FurnishingType:
    model: hauslet/internal/modules/property/domain.FurnishingType
  ListingType:
    model: hauslet/internal/modules/property/domain.ListingType
  ListingStatus:
    model: hauslet/internal/modules/property/domain.ListingStatus
  ReviewStatus:
    model: hauslet/internal/modules/property/domain.ReviewStatus
  PaymentPeriod:
    model: hauslet/internal/modules/property/domain.PaymentPeriod
  AccommodationType:
    model: hauslet/internal/modules/property/domain.AccommodationType
  RuleCategory:
    model: hauslet/internal/modules/property/domain.RuleCategory
  MediaType:
    model: hauslet/internal/modules/property/domain.MediaType

  # --- Business Module Bindings ---
  Business:
    model: hauslet/internal/modules/business/domain.Business
  BusinessMember:
    model: hauslet/internal/modules/business/domain.BusinessMember
  BusinessInvitation:
    model: hauslet/internal/modules/business/domain.BusinessInvitation
  MemberPermissions:
    model: hauslet/internal/modules/business/domain.MemberPermissions
  BusinessAddress:
    model: hauslet/internal/modules/business/domain.Address

  # Business Enums
  BusinessType:
    model: hauslet/internal/modules/business/domain.BusinessType
  MemberRole:
    model: hauslet/internal/modules/business/domain.MemberRole
  InvitationStatus:
    model: hauslet/internal/modules/business/domain.InvitationStatus

  # --- Wishlist Module Bindings ---
  Wishlist:
    model: hauslet/internal/modules/wishlist/domain.Wishlist
    fields:
      items:
        resolver: true
      itemCount:
        resolver: true
  WishlistItem:
    model: hauslet/internal/modules/wishlist/domain.WishlistItem
  WishlistItemSource:
    model: hauslet/internal/modules/wishlist/domain.WishlistItemSource

  # --- Booking Module Bindings ---
  Booking:
    model: hauslet/internal/modules/booking/domain.Booking
  BookingQuote:
    model: hauslet/internal/modules/booking/domain.BookingQuote
  PriceBreakdownSnapshot:
    model: hauslet/internal/modules/booking/domain.PriceBreakdownSnapshot
  DiscountSnapshot:
    model: hauslet/internal/modules/booking/domain.DiscountSnapshot
  DailyRate:
    model: hauslet/internal/modules/booking/domain.DailyRate

  # Booking Input/Output Types - Let gqlgen generate input types
  # Output types that contain domain data are bound
  CompleteBookingPayload:
    model: hauslet/internal/modules/booking/port/graphql.CompleteBookingPayload

  # Booking Enums
  BookingStatus:
    model: hauslet/internal/modules/booking/domain.BookingStatus
  BookingType:
    model: hauslet/internal/modules/booking/domain.BookingType

  # --- Payments Module Bindings ---
  Payment:
    model: hauslet/internal/modules/payments/domain.Payment
    fields:
      currency:
        resolver: true
      metadata:
        resolver: true
  PaymentMethod:
    model: hauslet/internal/modules/payments/domain.PaymentMethod
    fields:
      cardLast4:
        resolver: true
      cardExpMonth:
        resolver: true
      cardExpYear:
        resolver: true
      cardBrand:
        resolver: true
      accountName:
        resolver: true
      accountNumberLast4:
        resolver: true
  Transaction:
    model: hauslet/internal/modules/payments/domain.Transaction
    fields:
      currency:
        resolver: true
      providerRef:
        resolver: true
      providerResponse:
        resolver: true
      failureReason:
        resolver: true
  PayoutDetail:
    model: hauslet/internal/modules/payments/domain.PayoutDetail

  # Payment Input/Output Types
  CreatePaymentInput:
    model: hauslet/internal/modules/payments/port/graphql.CreatePaymentInput
  RefundPaymentInput:
    model: hauslet/internal/modules/payments/port/graphql.RefundPaymentInput
  CreatePaymentMethodInput:
    model: hauslet/internal/modules/payments/port/graphql.SavePaymentMethodInput
  AddPayoutDetailInput:
    model: hauslet/internal/modules/payments/port/graphql.AddPayoutDetailInput

  # Payment Enums
  PaymentStatus:
    model: hauslet/internal/modules/payments/domain.PaymentStatus
  PaymentMethodType:
    model: hauslet/internal/modules/payments/domain.PaymentMethodType
  Market:
    model: hauslet/internal/modules/payments/domain.Market
  TransactionType:
    model: hauslet/internal/modules/payments/domain.TransactionType
  TransactionStatus:
    model: hauslet/internal/modules/payments/domain.TransactionStatus

  # --- Finance Module Bindings ---
  Wallet:
    model: hauslet/internal/modules/finance/domain.Wallet
  LedgerEntry:
    model: hauslet/internal/modules/finance/domain.LedgerEntry
  FinanceTransaction:
    model: hauslet/internal/modules/finance/domain.Transaction
    fields:
      metadata:
        resolver: true
  Disbursement:
    model: hauslet/internal/modules/finance/domain.Disbursement
    fields:
      transferCode:
        resolver: true
      nextRetryAt:
        resolver: true
      completedAt:
        resolver: true
      failureReason:
        resolver: true
  EarningsSummary:
    model: hauslet/internal/modules/finance/port/graphql.EarningsSummary

  # Finance Enums
  WalletType:
    model: hauslet/internal/modules/finance/domain.WalletType
  WalletStatus:
    model: hauslet/internal/modules/finance/domain.WalletStatus
  FinanceTransactionType:
    model: hauslet/internal/modules/finance/domain.TransactionType
  FinanceTransactionStatus:
    model: hauslet/internal/modules/finance/domain.TransactionStatus
  DisbursementStatus:
    model: hauslet/internal/modules/finance/domain.DisbursementStatus

  # Dispute Types
  Dispute:
    model: hauslet/internal/modules/finance/domain.Dispute
  DisputeEvidence:
    model: hauslet/internal/modules/finance/domain.DisputeEvidence
  DisputeResolution:
    model: hauslet/internal/modules/finance/domain.DisputeResolution

  # Dispute Enums
  DisputeStatus:
    model: hauslet/internal/modules/finance/domain.DisputeStatus
  DisputeReason:
    model: hauslet/internal/modules/finance/domain.DisputeReason
  DisputeParty:
    model: hauslet/internal/modules/finance/domain.DisputeParty

  # Reconciliation Types
  ReconciliationReport:
    model: hauslet/internal/modules/finance/domain.ReconciliationReport
  Discrepancy:
    model: hauslet/internal/modules/finance/domain.Discrepancy

  # Reconciliation Enums
  ReconciliationStatus:
    model: hauslet/internal/modules/finance/domain.ReconciliationStatus
  DiscrepancyType:
    model: hauslet/internal/modules/finance/domain.DiscrepancyType
  DiscrepancySeverity:
    model: hauslet/internal/modules/finance/domain.DiscrepancySeverity

  # --- Review Module Bindings ---
  Review:
    model: hauslet/internal/modules/review/domain.Review
  ReviewResponse:
    model: hauslet/internal/modules/review/domain.ReviewResponse
  SubRatings:
    model: hauslet/internal/modules/review/domain.SubRatings
  ListingStats:
    model: hauslet/internal/modules/review/domain.ListingStats
  HostStats:
    model: hauslet/internal/modules/review/domain.HostStats
  RatingDistribution:
    model: hauslet/internal/modules/review/domain.RatingDistribution

  # Review Input/Output Types
  CreateReviewInput:
    model: hauslet/internal/modules/review/port/graphql.CreateReviewInput
  UpdateReviewInput:
    model: hauslet/internal/modules/review/port/graphql.UpdateReviewInput
  ReviewFilterInput:
    model: hauslet/internal/modules/review/port/graphql.ReviewFilterInput

  # Review Enums
  ReviewTargetType:
    model: hauslet/internal/modules/review/domain.ReviewTargetType
  ModerationReason:
    model: hauslet/internal/modules/review/domain.ModerationReason

  # --- Promotions Module Bindings ---
  ListingPromotion:
    model: hauslet/internal/modules/promotions/domain.ListingPromotion
  AgentSubscription:
    model: hauslet/internal/modules/promotions/domain.AgentSubscription
  UsageTracking:
    model: hauslet/internal/modules/promotions/domain.UsageTracking

  # Promotion Input/Output Types
  CreatePromotionPayload:
    model: hauslet/internal/modules/promotions/port/graphql.CreatePromotionPayload
  CreateSubscriptionPayload:
    model: hauslet/internal/modules/promotions/port/graphql.CreateSubscriptionPayload
  FeatureLimitCheckResult:
    model: hauslet/internal/modules/promotions/port/graphql.FeatureLimitCheckResult
  PlanLimits:
    model: hauslet/internal/modules/promotions/port/graphql.PlanLimits

  # Promotion Enums
  PromotionType:
    model: hauslet/internal/modules/promotions/domain.PromotionType
  PromotionStatus:
    model: hauslet/internal/modules/promotions/domain.PromotionStatus
  PlanType:
    model: hauslet/internal/modules/promotions/domain.PlanType
  BillingCycle:
    model: hauslet/internal/modules/promotions/domain.BillingCycle
  SubscriptionStatus:
    model: hauslet/internal/modules/promotions/domain.SubscriptionStatus

  # --- Leads Module Bindings ---
  Lead:
    model: hauslet/internal/modules/leads/domain.Lead
  LeadEvent:
    model: hauslet/internal/modules/leads/domain.LeadEvent

  # Leads Enums
  LeadStatus:
    model: hauslet/internal/modules/leads/domain.LeadStatus
  LeadSource:
    model: hauslet/internal/modules/leads/domain.LeadSource
  LeadEventType:
    model: hauslet/internal/modules/leads/domain.LeadEventType
  ActorType:
    model: hauslet/internal/modules/leads/domain.ActorType
  AssignmentReason:
    model: hauslet/internal/modules/leads/domain.AssignmentReason
