# gqlgen.yml

# 1. Schema Location
schema:
  - internal/transport/graph/*.graphqls
  - internal/modules/auth/port/graphql/*.graphqls
  - internal/modules/profile/port/graphql/*.graphqls
  - internal/modules/property/port/graphql/*.graphqls
  - internal/modules/business/port/graphql/*.graphqls
  - internal/modules/wishlist/port/graphql/*.graphqls

# 2. Server Logic (The Wiring)
exec:
  filename: internal/transport/graph/generated.go
  package: graph

# 3. Generated Models
# Input types and types NOT bound to Go structs land here
model:
  filename: internal/transport/graph/model/models_gen.go
  package: model

# 4. Resolver Implementation
resolver:
  layout: follow-schema
  dir: internal/transport/graph
  package: graph
  filename_template: "{name}.resolvers.go"

# 5. Type Mappings (The Bridge)
models:
  # --- Standard Scalars ---
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  
  # --- Auth Module Bindings ---
  User:
    model: hauslet/internal/modules/auth/domain.User
  UserIdentity:
    model: hauslet/internal/modules/auth/domain.UserIdentity
  Role:
    model: hauslet/internal/modules/auth/domain.UserRole

  # --- Profile Module Bindings ---
  Profile:
    model: hauslet/internal/modules/profile/domain.Profile
  
  # TravelCompanion is nested inside Profile
  TravelCompanion:
    model: hauslet/internal/modules/profile/domain.TravelCompanion

  # Enum Mappings
  UserType:
    model: hauslet/internal/modules/profile/domain.UserType
  Badge:
    model: hauslet/internal/modules/profile/domain.Badge
  UUID:
    model:
      - github.com/google/uuid.UUID

  # --- Property Module Bindings ---
  Property:
    model: hauslet/internal/modules/property/domain.Property
  Listing:
    model: hauslet/internal/modules/property/domain.Listing
  ListingMedia:
    model: hauslet/internal/modules/property/domain.ListingMedia
  Location:
    model: hauslet/internal/modules/property/domain.Location
  ShortletDetail:
    model: hauslet/internal/modules/property/domain.ShortletDetail
  RentalDetail:
    model: hauslet/internal/modules/property/domain.RentalDetail
  SaleDetail:
    model: hauslet/internal/modules/property/domain.SaleDetail
  AmenityHighlight:
    model: hauslet/internal/modules/property/domain.AmenityHighlight
  RuleGroup:
    model: hauslet/internal/modules/property/domain.RuleGroup
  ServiceCharge:
    model: hauslet/internal/modules/property/domain.ServiceCharge
  ListingCompleteness:
    model: hauslet/internal/modules/property/domain.ListingCompleteness
  Thumbnail:
    model: hauslet/internal/modules/property/domain.Thumbnail
  ThumbnailVariant:
    model: hauslet/internal/modules/property/domain.ThumbnailVariant

  # Property Enums
  CountryCode:
    model: hauslet/internal/modules/property/domain.CountryCode
  CurrencyCode:
    model: hauslet/internal/modules/property/domain.CurrencyCode
  OwnerType:
    model: hauslet/internal/modules/property/domain.OwnerType
  PropertyClass:
    model: hauslet/internal/modules/property/domain.PropertyClass
  PropertyType:
    model: hauslet/internal/modules/property/domain.PropertyType
  PropertyCondition:
    model: hauslet/internal/modules/property/domain.PropertyCondition
  FurnishingType:
    model: hauslet/internal/modules/property/domain.FurnishingType
  ListingType:
    model: hauslet/internal/modules/property/domain.ListingType
  ListingStatus:
    model: hauslet/internal/modules/property/domain.ListingStatus
  ReviewStatus:
    model: hauslet/internal/modules/property/domain.ReviewStatus
  PaymentPeriod:
    model: hauslet/internal/modules/property/domain.PaymentPeriod
  AccommodationType:
    model: hauslet/internal/modules/property/domain.AccommodationType
  RuleCategory:
    model: hauslet/internal/modules/property/domain.RuleCategory
  MediaType:
    model: hauslet/internal/modules/property/domain.MediaType

  # --- Business Module Bindings ---
  Business:
    model: hauslet/internal/modules/business/domain.Business
  BusinessMember:
    model: hauslet/internal/modules/business/domain.BusinessMember
  BusinessInvitation:
    model: hauslet/internal/modules/business/domain.BusinessInvitation
  MemberPermissions:
    model: hauslet/internal/modules/business/domain.MemberPermissions
  BusinessAddress:
    model: hauslet/internal/modules/business/domain.Address

  # Business Enums
  BusinessType:
    model: hauslet/internal/modules/business/domain.BusinessType
  MemberRole:
    model: hauslet/internal/modules/business/domain.MemberRole
  InvitationStatus:
    model: hauslet/internal/modules/business/domain.InvitationStatus

  # --- Wishlist Module Bindings ---
  Wishlist:
    model: hauslet/internal/modules/wishlist/domain.Wishlist
    fields:
      items:
        resolver: true
      itemCount:
        resolver: true
  WishlistItem:
    model: hauslet/internal/modules/wishlist/domain.WishlistItem
  WishlistItemSource:
    model: hauslet/internal/modules/wishlist/domain.WishlistItemSource
