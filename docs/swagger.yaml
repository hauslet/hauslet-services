          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke all sessions
      tags:
      - session
    get:
      description: List all active sessions for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/hauslet_internal_modules_auth_domain.SessionResponse'
