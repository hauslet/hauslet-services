      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
        "401":
          description: Unauthorized
