        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unlink identity
      tags:
      - user
  /me/sessions:
    delete:
      description: Revoke all sessions for the authenticated user (useful for "logout
        everywhere")
