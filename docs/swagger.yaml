      description: List all authentication methods (OAuth providers and password)
        linked to the user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/hauslet_internal_modules_auth_domain.UserIdentityResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user identities
      tags:
      - user
  /me/identities/{id}:
    delete:
      description: Remove an OAuth provider or password authentication from user account
      parameters:
      - description: Identity ID
        in: path
        name: id
        required: true
