basePath: /
definitions:
  hauslet_internal_modules_auth_domain.BackupCodesResult:
    properties:
      codes:
        description: Plain text codes (shown once)
        items:
          type: string
        type: array
    type: object
  hauslet_internal_modules_auth_domain.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  hauslet_internal_modules_auth_domain.ErrorResponse:
    properties:
      error:
        type: string
      field:
        type: string
      message:
        type: string
    type: object
  hauslet_internal_modules_auth_domain.RegisterRequest:
    properties:
      birth_date:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  hauslet_internal_modules_auth_domain.RegisterResponse:
    properties:
      email:
        type: string
      id:
        type: string
      message:
        type: string
      name:
        type: string
    type: object
  hauslet_internal_modules_auth_domain.SessionResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      ip:
        type: string
      provider:
        type: string
      user_agent:
        type: string
    type: object
  hauslet_internal_modules_auth_domain.SetupResponse:
    properties:
      method:
        $ref: '#/definitions/hauslet_internal_modules_auth_domain.TwoFactorMethod'
      qr_code_image:
        description: Base64 data URL for QR code image
        type: string
      qr_code_url:
        description: otpauth:// URL (for authenticator)
        type: string
      secret:
        description: Only for authenticator (shown once)
        type: string
    type: object
  hauslet_internal_modules_auth_domain.TwoFactorMethod:
    enum:
    - email
    - sms
    - authenticator
    type: string
    x-enum-varnames:
    - TwoFactorEmail
    - TwoFactorSMS
    - TwoFactorAuthenticator
  hauslet_internal_modules_auth_domain.TwoFactorStatus:
    properties:
      backup_codes_left:
        type: integer
      enabled:
        type: boolean
      method:
        $ref: '#/definitions/hauslet_internal_modules_auth_domain.TwoFactorMethod'
    type: object
  hauslet_internal_modules_auth_domain.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  hauslet_internal_modules_auth_domain.UserIdentityResponse:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      provider:
        type: string
    type: object
  hauslet_internal_modules_auth_domain.UserResponse:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  hauslet_internal_modules_auth_domain.Verify2FALoginRequest:
    properties:
      code:
        type: string
      temp_token:
        type: string
    type: object
  hauslet_internal_modules_property_domain.DeleteMediaRequest:
    properties:
      media:
        items:
          $ref: '#/definitions/hauslet_internal_modules_property_domain.MediaDeleteInput'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - media
    type: object
  hauslet_internal_modules_property_domain.ErrorResponse:
    properties:
      error:
        type: string
      field:
        type: string
      message:
        type: string
    type: object
  hauslet_internal_modules_property_domain.FinalizeMediaRequest:
    properties:
      media_keys:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - media_keys
    type: object
  hauslet_internal_modules_property_domain.MediaDeleteInput:
    properties:
      key:
        type: string
      media_id:
        type: string
    required:
    - key
    - media_id
    type: object
  hauslet_internal_modules_property_domain.MediaType:
    enum:
    - image
    - video
    - 360_tour
    - document
    type: string
    x-enum-varnames:
    - MediaTypeImage
    - MediaTypeVideo
    - MediaTypeTour360
    - MediaTypeDocument
  hauslet_internal_modules_property_domain.MediaUploadInput:
    properties:
      caption:
        type: string
      duration:
        type: integer
      filename:
        type: string
      group:
        type: string
      is_group_cover:
        type: boolean
      is_primary:
        type: boolean
      mime_type:
        type: string
      order:
        type: integer
      size_bytes:
        type: integer
      type:
        $ref: '#/definitions/hauslet_internal_modules_property_domain.MediaType'
    required:
    - filename
    - size_bytes
    - type
    type: object
  hauslet_internal_modules_property_domain.MediaUploadResult:
    properties:
      filename:
        type: string
      id:
        type: string
      key:
        type: string
      url:
        type: string
    type: object
  hauslet_internal_modules_property_domain.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  hauslet_internal_modules_property_domain.UpdateMediaRequest:
    properties:
      caption:
        type: string
      is_group_cover:
        type: boolean
      is_primary:
        type: boolean
      order:
        type: integer
    type: object
  hauslet_internal_modules_property_domain.UploadMediaRequest:
    properties:
      media:
        items:
          $ref: '#/definitions/hauslet_internal_modules_property_domain.MediaUploadInput'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - media
    type: object
  hauslet_internal_modules_property_domain.UploadMediaResponse:
    properties:
      media:
        items:
          $ref: '#/definitions/hauslet_internal_modules_property_domain.MediaUploadResult'
        type: array
      total:
        type: integer
    type: object
  internal_modules_auth_port_http.PasswordlessLoginRequest:
    properties:
      code:
        type: string
      email:
        type: string
    type: object
  internal_modules_auth_port_http.ResendOTPRequest:
    properties:
      email:
        type: string
    type: object
  internal_modules_auth_port_http.Setup2FARequest:
    properties:
      method:
        description: '"email", "sms", "authenticator"'
        type: string
      phone_number:
        description: Required for SMS method
        type: string
    type: object
  internal_modules_auth_port_http.Verify2FARequest:
    properties:
      code:
        type: string
    type: object
  internal_modules_auth_port_http.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    type: object
  internal_modules_messaging_port_http.GenerateUploadURLRequest:
    properties:
      attachment_id:
        type: string
      content_type:
        type: string
      conversation_id:
        type: string
      expires_in_seconds:
        type: integer
      filename:
        type: string
      size_bytes:
        type: integer
    type: object
  internal_modules_messaging_port_http.GenerateUploadURLResponse:
    properties:
      key:
        type: string
      url:
        type: string
    type: object
  token.User:
    properties:
      attrs:
        additionalProperties: true
        type: object
      aud:
        type: string
      email:
        type: string
      id:
        type: string
      ip:
        description: set by client
        type: string
      name:
        description: set by service
        type: string
      picture:
        type: string
      role:
        type: string
    type: object
host: https://dev-api.hauslet.com
info:
  contact:
    email: support@hauslet.com
    name: API Support
    url: http://www.swagger.io/support
  description: Hauslet Services API Server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Hauslet API
  version: "1.0"
paths:
  /2fa/backup-codes:
    post:
      consumes:
      - application/json
      description: Generates new backup codes after verifying current 2FA code
      parameters:
      - description: Current 2FA code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_port_http.Verify2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.BackupCodesResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Regenerate backup codes
      tags:
      - 2FA
  /2fa/disable:
    post:
      consumes:
      - application/json
      description: Disables 2FA after verifying current code
      parameters:
      - description: Current 2FA code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_port_http.Verify2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Disable 2FA
      tags:
      - 2FA
  /2fa/send-code:
    post:
      description: Sends a new verification code for Email/SMS 2FA
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send 2FA code
      tags:
      - 2FA
  /2fa/setup:
    post:
      consumes:
      - application/json
      description: Starts 2FA setup with the selected method
      parameters:
      - description: Setup request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_port_http.Setup2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.SetupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Initiate 2FA setup
      tags:
      - 2FA
  /2fa/setup/complete:
    post:
      consumes:
      - application/json
      description: Verifies the code and enables 2FA
      parameters:
      - description: Verification code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_port_http.Verify2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.BackupCodesResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Complete 2FA setup
      tags:
      - 2FA
  /2fa/status:
    get:
      description: Returns whether 2FA is enabled and which method
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.TwoFactorStatus'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get 2FA status
      tags:
      - 2FA
  /2fa/verify:
    post:
      consumes:
      - application/json
      description: Verifies the 2FA code to complete login
      parameters:
      - description: Verification code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_port_http.Verify2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      summary: Verify 2FA code
      tags:
      - 2FA
  /api/listings/{id}/media:
    delete:
      consumes:
      - application/json
      description: Delete one or more media items from a listing
      parameters:
      - description: Listing ID
        in: path
        name: id
        required: true
        type: string
      - description: Media delete details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hauslet_internal_modules_property_domain.DeleteMediaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete listing media
      tags:
      - listings
    post:
      consumes:
      - application/json
      description: Generate presigned upload URLs for listing media
      parameters:
      - description: Listing ID
        in: path
        name: id
        required: true
        type: string
      - description: Media upload details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hauslet_internal_modules_property_domain.UploadMediaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.UploadMediaResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload listing media
      tags:
      - listings
  /api/listings/{id}/media/{mediaId}:
    patch:
      consumes:
      - application/json
      description: Update metadata for a specific media item
      parameters:
      - description: Listing ID
        in: path
        name: id
        required: true
        type: string
      - description: Media ID
        in: path
        name: mediaId
        required: true
        type: string
      - description: Media update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hauslet_internal_modules_property_domain.UpdateMediaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update listing media
      tags:
      - listings
  /api/listings/{id}/media/finalize:
    post:
      consumes:
      - application/json
      description: Mark media as uploaded and trigger thumbnail generation
      parameters:
      - description: Listing ID
        in: path
        name: id
        required: true
        type: string
      - description: Media finalization details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hauslet_internal_modules_property_domain.FinalizeMediaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/hauslet_internal_modules_property_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Finalize listing media
      tags:
      - listings
  /auth/{provider}/callback:
    get:
      description: Callback endpoint for OAuth providers. Handled automatically, but
        documented for completeness.
      parameters:
      - description: Provider Name
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization Code
        in: query
        name: code
        required: true
        type: string
      - description: State
        in: query
        name: state
        required: true
        type: string
      responses: {}
      summary: OAuth Callback
      tags:
      - auth
  /auth/{provider}/login:
    get:
      description: Initiate OAuth login flow for a specific provider.
      parameters:
      - description: Provider Name (e.g., google, github)
        in: path
        name: provider
        required: true
        type: string
      responses: {}
      summary: OAuth Login
      tags:
      - auth
  /auth/2fa/resend:
    post:
      consumes:
      - application/json
      description: Resends the verification code for pending 2FA login
      parameters:
      - description: Temp token
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      summary: Resend 2FA code
      tags:
      - 2FA
  /auth/2fa/verify:
    post:
      consumes:
      - application/json
      description: Verifies the 2FA code and issues a full JWT token
      parameters:
      - description: Temp token and verification code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hauslet_internal_modules_auth_domain.Verify2FALoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      summary: Complete 2FA login
      tags:
      - 2FA
  /auth/link/{provider}:
    get:
      description: Start OAuth flow to link a provider (google) to authenticated user
        account
      parameters:
      - description: Provider name (google)
        in: path
        name: provider
        required: true
        type: string
      - description: 'URI to redirect after linking (default: /settings)'
        in: query
        name: redirect_uri
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to OAuth provider
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Initiate identity linking
      tags:
      - user
  /auth/list:
    get:
      description: List all enabled authentication providers (e.g., google, github,
        email).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: List Auth Providers
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - application/json
      description: Authenticate using email/username and password.
      parameters:
      - description: User Email or Username
        in: formData
        name: user
        required: true
        type: string
      - description: Password
        in: formData
        name: passwd
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      summary: Login with Email/Password
      tags:
      - auth
  /auth/logout:
    get:
      description: Logout and clear the session cookie/token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Logout
      tags:
      - auth
  /auth/passwordless/verify:
    post:
      consumes:
      - application/json
      description: Verify the 6-digit code sent to email and issue a JWT session
      parameters:
      - description: Email and verification code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_port_http.PasswordlessLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
      summary: Verify passwordless login code
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hauslet_internal_modules_auth_domain.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/hauslet_internal_modules_auth_domain.ErrorResponse'
        "500":
          description: Internal Server Error
